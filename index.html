<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.Gov & .Edu Document Download & Search</title>
    <script type="importmap">
    {
        "imports": {
            "solid-js": "https://esm.sh/solid-js@1.8.14",
            "solid-js/web": "https://esm.sh/solid-js@1.8.14/web",
            "solid-js/h": "https://esm.sh/solid-js@1.8.14/h"
        }
    }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <style>
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased h-screen overflow-hidden flex flex-col font-sans">
    <div id="app" class="flex-1 flex flex-col h-full overflow-hidden"></div>
    <script type="module">
        import { createSignal, onMount } from "solid-js";
        import { render } from "solid-js/web";
        import h from "solid-js/h";

        const stateNameToAbbr = {
            "Alabama": "AL", "Alaska": "AK", "Arizona": "AZ", "Arkansas": "AR", "California": "CA",
            "Colorado": "CO", "Connecticut": "CT", "Delaware": "DE", "Florida": "FL", "Georgia": "GA",
            "Hawaii": "HI", "Idaho": "ID", "Illinois": "IL", "Indiana": "IN", "Iowa": "IA",
            "Kansas": "KS", "Kentucky": "KY", "Louisiana": "LA", "Maine": "ME", "Maryland": "MD",
            "Massachusetts": "MA", "Michigan": "MI", "Minnesota": "MN", "Mississippi": "MS", "Missouri": "MO",
            "Montana": "MT", "Nebraska": "NE", "Nevada": "NV", "New Hampshire": "NH", "New Jersey": "NJ",
            "New Mexico": "NM", "New York": "NY", "North Carolina": "NC", "North Dakota": "ND", "Ohio": "OH",
            "Oklahoma": "OK", "Oregon": "OR", "Pennsylvania": "PA", "Rhode Island": "RI", "South Carolina": "SC",
            "South Dakota": "SD", "Tennessee": "TN", "Texas": "TX", "Utah": "UT", "Vermont": "VT",
            "Virginia": "VA", "Washington": "WA", "West Virginia": "WV", "Wisconsin": "WI", "Wyoming": "WY",
            "District of Columbia": "DC"
        };

        function App() {
            const [pdfs, setPdfs] = createSignal([]);
            const [domains, setDomains] = createSignal([]);
            const [q, setQ] = createSignal("");
            const [embeddingStatus, setEmbeddingStatus] = createSignal("");
            const [res, setRes] = createSignal([]);
            const [countyHits, setCountyHits] = createSignal({});
            const [progress, setProgress] = createSignal({visited: 0, total: 0, pdfs_discovered: 0, domains_crawled: 0, total_domains: 0, counties_completed: 0, total_counties: 3144, gov_crawled: 0, edu_crawled: 0, total_gov: 0, total_edu: 0});
            const [showModal, setShowModal] = createSignal(false);
            const [isPaused, setIsPaused] = createSignal(false);
            const [isEmbeddingPaused, setIsEmbeddingPaused] = createSignal(false);
            const [isEmbeddingActive, setIsEmbeddingActive] = createSignal(false);
            const [isSearching, setIsSearching] = createSignal(false);
            const [urlQueueStatus, setUrlQueueStatus] = createSignal({ queue_len: 0, current: "Idle" });
            const [embeddingQueueStatus, setEmbeddingQueueStatus] = createSignal({ queue_len: 0, current: "Idle" });
            const [graphData, setGraphData] = createSignal({ nodes: [], edges: [], community_count: 0, partitions: [], modularity: 0.0, clustering_coefficient: 0.0 });
            
            const [nodeSearchQuery, setNodeSearchQuery] = createSignal("");
            const [tldFilter, setTldFilter] = createSignal("all");
            const [queueTldView, setQueueTldView] = createSignal("gov");
            const [activeBackendMode, setActiveBackendMode] = createSignal("gov");

            const [indexSize, setIndexSize] = createSignal(0);
            const [processedDocsCount, setProcessedDocsCount] = createSignal(0);
            const [totalDocsCount, setTotalDocsCount] = createSignal(0);
            const [totalEmbeddingsCount, setTotalEmbeddingsCount] = createSignal(0);

            const [embeddingLevel, setEmbeddingLevel] = createSignal('chunk');
            const [hoveredNode, setHoveredNode] = createSignal(null);
            const [hoverPos, setHoverPos] = createSignal({ x: 0, y: 0 });
            const [pinnedNodes, setPinnedNodes] = createSignal([]);
            const [pinMode, setPinMode] = createSignal(false);

            const [activeTab, setActiveTab] = createSignal('map');
            const [mapLoading, setMapLoading] = createSignal(true);

            let mapContainer;
            let graphContainer;
            let sampleSizeInput;
            let targetPartitionsInput;

            let cachedGovStatusMap = {};
            let cachedEduStatusMap = {};
            let canvasZoomTransform = d3.zoomIdentity;
            let canvasZoomBehavior = null;
            let currentSimulation = null;
            let embeddingEvtSource = null;
            let graphInitialized = false;

            onMount(async () => {
                try {
                    const initState = await (await fetch("/state")).json();
                    if (initState.pdfs) setPdfs(initState.pdfs);
                    if (initState.progress) setProgress(initState.progress);
                    const domData = await (await fetch("/domains-status")).json();
                    setDomains(domData);
                } catch (e) {}

                try {
                    const statusRes = await (await fetch("/crawler/status")).json();
                    setIsPaused(statusRes.paused);
                    if (statusRes.mode) {
                        setQueueTldView(statusRes.mode);
                        setActiveBackendMode(statusRes.mode);
                        setUrlQueueStatus(q => ({ ...q, queue_len: statusRes.pending_count }));
                    }
                } catch (e) {}

                fetchIndexStats();

                if (mapContainer) {
                    initMap(mapContainer);
                }

                const connectWs = () => {
                    const ws = new WebSocket("ws://" + location.host + "/ws");
                    ws.onmessage = async e => {
                        const d = JSON.parse(e.data);
                        if (d.type === "progress" || d.type === "stats") {
                            if (d.visited !== undefined) setProgress(p => ({...p, visited: d.visited, total: d.total}));
                            if (d.stats) setProgress(p => ({...p, ...d.stats}));
                        } else if (d.type === "pdf_found") {
                            setPdfs(p => [d, ...p]);
                            fetchIndexStats();
                        } else if (d.type === "domain_update") {
                            setDomains(ds => {
                                const updated = ds.map(dom => dom.domain === d.domain ? {...dom, status: d.status} : dom);
                                return updated;
                            });
                            if (mapContainer && activeTab() === 'map') {
                                fetchAndUpdateMapColors();
                            }
                        } else if (d.type === "embedding_complete") {
                            setPdfs(p => p.map(doc => doc.pdf_url === d.metric.pdf_url ? {...doc, processed: 1} : doc));
                            fetchIndexStats();
                        } else if (d.type === "queue_update") {
                            if (d.tld_type === activeBackendMode()) {
                                setUrlQueueStatus({ queue_len: d.queue_len, current: d.current });
                            }
                        } else if (d.type === "embedding_queue_update") {
                            setEmbeddingQueueStatus({ queue_len: d.queue_len, current: d.current });
                        } else if (d.type === "louvain_progress") {
                            setEmbeddingStatus(d.message);
                        }
                    };
                    ws.onclose = () => setTimeout(connectWs, 3000);
                };
                connectWs();
            });

            const switchQueueTld = async (mode) => {
                setQueueTldView(mode);
                try {
                    const resp = await fetch("/crawler/tld-mode", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ mode })
                    });
                    const data = await resp.json();
                    setActiveBackendMode(data.mode);
                    setUrlQueueStatus({ queue_len: data.pending_count, current: data.pending_count > 0 ? "Ready" : "Idle" });
                } catch (e) {}
            };

            const fetchIndexStats = async () => {
                try {
                    const res = await (await fetch("/index-stats")).json();
                    setIndexSize(res.index_size);
                    setProcessedDocsCount(res.processed_documents);
                    setTotalDocsCount(res.total_documents);
                    setTotalEmbeddingsCount(res.total_embeddings);
                } catch (e) {}
            };

            const getCachedTopoJson = async () => {
                const cached = localStorage.getItem("us_topo_json_cache");
                if (cached) {
                    try { return JSON.parse(cached); } catch (err) {}
                }
                const data = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/counties-albers-10m.json");
                try { localStorage.setItem("us_topo_json_cache", JSON.stringify(data)); } catch (err) {}
                return data;
            };

            const initMap = async (container) => {
                setMapLoading(true);
                container.innerHTML = "";
                
                const usData = await getCachedTopoJson();
                
                const svg = d3.select(container).append("svg")
                    .attr("viewBox", "0 0 960 600")
                    .attr("class", "w-full h-full max-h-[480px] object-contain");
                const path = d3.geoPath();
                const counties = topojson.feature(usData, usData.objects.counties).features;
                const states = topojson.feature(usData, usData.objects.states).features;
                const countyNames = counties.map(d => d.properties.name).filter(Boolean);

                let stateStats = {};
                try {
                    const [mapResp, statsResp] = await Promise.all([
                        fetch("/map-status", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ counties: countyNames })
                        }),
                        fetch("/state-stats")
                    ]);
                    const mapResJson = await mapResp.json();
                    cachedGovStatusMap = mapResJson.gov || {};
                    cachedEduStatusMap = mapResJson.edu || {};
                    stateStats = await statsResp.json();
                } catch (e) {}

                let tooltip = d3.select(container).select(".map-tooltip");
                if (tooltip.empty()) {
                    tooltip = d3.select(container).append("div")
                        .attr("class", "map-tooltip absolute hidden bg-slate-900 text-white text-xs rounded p-3 pointer-events-none shadow-xl z-50 font-mono");
                }

                svg.append("g").selectAll("path").data(counties).join("path")
                    .attr("d", path)
                    .attr("stroke", "#cbd5e1")
                    .attr("stroke-width", 0.2)
                    .attr("class", "county-path")
                    .attr("data-county", d => d.properties.name || "")
                    .attr("fill", d => {
                        const countyName = d.properties.name || "";
                        const govStatus = cachedGovStatusMap[countyName] || "PENDING";
                        return govStatus === 'COMPLETED' ? "#10b981" : (govStatus === 'CRAWLING' || govStatus === 'QUEUED' ? "#f59e0b" : "#e2e8f0");
                    })
                    .on("mousemove", (event, d) => {
                        const countyName = d.properties.name || "Unknown County";
                        const govStatus = cachedGovStatusMap[countyName] || "PENDING";
                        const eduStatus = cachedEduStatusMap[countyName] || "PENDING";
                        tooltip.classed("hidden", false)
                            .html(`<strong>County: ${countyName}</strong><br/>.gov Status: ${govStatus}<br/>.edu Status: ${eduStatus}`);
                        const [x, y] = d3.pointer(event, container);
                        tooltip.style("left", (x + 15) + "px").style("top", (y - 15) + "px");
                    })
                    .on("mouseleave", () => {
                        tooltip.classed("hidden", true);
                    });

                svg.append("g").selectAll("path").data(states).join("path")
                    .attr("d", path)
                    .attr("fill", "transparent")
                    .attr("stroke", "#475569")
                    .attr("stroke-width", 0.6)
                    .attr("class", "state-overlay-path")
                    .on("mousemove", (event, d) => {
                        const stateName = d.properties.name;
                        const abbr = stateNameToAbbr[stateName] || "";
                        const stats = stateStats[abbr] || { gov_urls: 0, edu_urls: 0, edu_domains: 0, urls: 0, documents: 0, embeddings: 0 };
                        
                        tooltip.classed("hidden", false)
                            .html(`<strong>${stateName} (${abbr || 'N/A'})</strong><br/>.gov Domains: ${stats.gov_urls || 0}<br/>.edu Domains: ${stats.edu_urls ?? stats.edu_domains ?? 0}<br/>Documents: ${stats.documents || 0}<br/>Embeddings: ${stats.embeddings || 0}`);
                        const [x, y] = d3.pointer(event, container);
                        tooltip.style("left", (x + 15) + "px").style("top", (y - 15) + "px");
                    })
                    .on("mouseleave", () => {
                        tooltip.classed("hidden", true);
                    });

                setMapLoading(false);
            };

            const fetchAndUpdateMapColors = async () => {
                if (!mapContainer) return;
                const paths = mapContainer.querySelectorAll(".county-path");
                if (paths.length === 0) return;

                const countyNames = Array.from(paths).map(p => p.getAttribute("data-county")).filter(Boolean);
                try {
                    const resp = await fetch("/map-status", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ counties: countyNames })
                    });
                    const mapResJson = await resp.json();
                    cachedGovStatusMap = mapResJson.gov || {};
                    cachedEduStatusMap = mapResJson.edu || {};
                    
                    paths.forEach(pathEl => {
                        const name = pathEl.getAttribute("data-county");
                        const status = cachedGovStatusMap[name] || "PENDING";
                        const fillColor = status === 'COMPLETED' ? "#10b981" : (status === 'CRAWLING' || status === 'QUEUED' ? "#f59e0b" : "#e2e8f0");
                        pathEl.setAttribute("fill", fillColor);
                    });
                } catch (e) {}
            };

            const toggleCrawler = async () => {
                try {
                    const res = await (await fetch("/crawler/toggle", { method: "POST" })).json();
                    setIsPaused(res.paused);
                } catch (e) {}
            };

            const toggleEmbedding = () => {
                if (!isEmbeddingActive()) {
                    setIsEmbeddingActive(true);
                    setIsEmbeddingPaused(false);
                    triggerEmbeddingStream();
                } else {
                    const nextPaused = !isEmbeddingPaused();
                    setIsEmbeddingPaused(nextPaused);
                    if (nextPaused) {
                        if (embeddingEvtSource) {
                            embeddingEvtSource.close();
                            embeddingEvtSource = null;
                        }
                        setEmbeddingStatus("Embedding paused.");
                        setEmbeddingQueueStatus(q => ({ ...q, current: "Paused" }));
                    } else {
                        triggerEmbeddingStream();
                    }
                }
            };

            const search = async e => {
                if (e) e.preventDefault();
                if (!q().trim()) return;
                setIsSearching(true);
                try {
                    const r = await (await fetch("/search", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({query: q()}) })).json();
                    setRes(r.results || []);
                    setCountyHits(r.county_hits || {});
                } catch (err) {
                    setRes([]);
                } finally {
                    setIsSearching(false);
                }
            };

            const triggerEmbeddingStream = async () => {
                setEmbeddingStatus("Starting extraction pipeline (.gov & .edu)...");
                if (embeddingEvtSource) {
                    embeddingEvtSource.close();
                }
                embeddingEvtSource = new EventSource("/process-embeddings-stream");
                embeddingEvtSource.onmessage = async event => {
                    if (isEmbeddingPaused()) return;
                    const data = JSON.parse(event.data);
                    if (data.status === 'progress') setEmbeddingStatus(data.message);
                    else if (data.status === 'completed') { 
                        setEmbeddingStatus(data.message); 
                        embeddingEvtSource.close();
                        embeddingEvtSource = null;
                        setIsEmbeddingActive(false);
                        setIsEmbeddingPaused(false);
                        fetchGraphCommunities();
                        fetchIndexStats();
                    }
                    else if (data.status === 'error') setEmbeddingStatus(`Error: ${data.message}`);
                };
                embeddingEvtSource.onerror = () => { 
                    if (!isEmbeddingPaused()) {
                        setEmbeddingStatus("Stream completed."); 
                        if (embeddingEvtSource) embeddingEvtSource.close();
                        embeddingEvtSource = null;
                        setIsEmbeddingActive(false);
                        setIsEmbeddingPaused(false);
                    }
                    fetchIndexStats(); 
                };
            };

            const fetchGraphCommunities = async () => {
                try {
                    setEmbeddingStatus("Computing Louvain partitions (.gov & .edu)...");
                    const sVal = sampleSizeInput ? (parseInt(sampleSizeInput.value) || 150) : 150;
                    const pVal = targetPartitionsInput ? (parseInt(targetPartitionsInput.value) || 5) : 5;
                    const res = await fetch(`/graph-communities?target_partitions=${pVal}&sample_size=${sVal}&level=${embeddingLevel()}`);
                    const gRes = await res.json();
                    setGraphData(gRes);
                    graphInitialized = true;
                    if (activeTab() === 'louvain') {
                        renderCanvasGraph(gRes);
                    }
                    setEmbeddingStatus(`Clusters rendered. Modularity: ${gRes.modularity}, Clustering Coefficient: ${gRes.clustering_coefficient}`);
                    fetchIndexStats();
                } catch (err) {
                    setEmbeddingStatus("Clustering failed.");
                }
            };

            const renderCanvasGraph = (data) => {
                if (!graphContainer) return;
                graphContainer.innerHTML = "";
                if (!data.nodes || data.nodes.length === 0) {
                    graphContainer.innerHTML = "<div class='text-xs text-slate-400 py-12'>No indexed chunks available for graph visualization. Process pending .gov / .edu PDFs to generate embeddings.</div>";
                    return;
                }

                const width = 800;
                const height = 300;

                const canvas = document.createElement("canvas");
                canvas.width = width * window.devicePixelRatio;
                canvas.height = height * window.devicePixelRatio;
                canvas.style.width = "100%";
                canvas.style.height = "auto";
                canvas.style.maxHeight = "300px";
                canvas.style.objectFit = "contain";
                graphContainer.appendChild(canvas);

                const ctx = canvas.getContext("2d");
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

                const colorScale = d3.scaleOrdinal(d3.schemeTableau10);
                
                const filter = tldFilter();
                const simNodes = data.nodes.filter(d => {
                    if (filter === 'edu') return d.full_text.includes('.edu') || (d.pdf_url && d.pdf_url.includes('.edu'));
                    if (filter === 'gov') return !d.full_text.includes('.edu') && (!d.pdf_url || !d.pdf_url.includes('.edu'));
                    return true;
                }).map(d => ({...d}));

                const activeNodeIds = new Set(simNodes.map(n => n.id));
                const simLinks = data.edges.filter(l => activeNodeIds.has(l.source.id || l.source) && activeNodeIds.has(l.target.id || l.target)).map(d => ({...d}));

                if (currentSimulation) currentSimulation.stop();

                currentSimulation = d3.forceSimulation(simNodes)
                    .force("link", d3.forceLink(simLinks).id(d => d.id).distance(35))
                    .force("charge", d3.forceManyBody().strength(-20))
                    .force("center", d3.forceCenter(width / 2, height / 2));

                const draw = () => {
                    ctx.save();
                    ctx.clearRect(0, 0, width, height);
                    ctx.translate(canvasZoomTransform.x, canvasZoomTransform.y);
                    ctx.scale(canvasZoomTransform.k, canvasZoomTransform.k);

                    ctx.strokeStyle = "#cbd5e1";
                    ctx.lineWidth = 0.8;
                    for (const link of simLinks) {
                        ctx.beginPath();
                        ctx.moveTo(link.source.x, link.source.y);
                        ctx.lineTo(link.target.x, link.target.y);
                        ctx.stroke();
                    }

                    const query = nodeSearchQuery().toLowerCase().trim();

                    for (const node of simNodes) {
                        ctx.beginPath();
                        const isMatch = query && (node.full_text.toLowerCase().includes(query) || String(node.id).includes(query) || String(node.group).includes(query));
                        const radius = isMatch ? 11 : 6;
                        ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI);
                        ctx.fillStyle = colorScale(node.group);
                        ctx.fill();

                        const isPinned = pinnedNodes().some(p => p.id === node.id);
                        ctx.strokeStyle = isMatch ? "#ff00ff" : (isPinned ? "#0f172a" : "#fff");
                        ctx.lineWidth = isMatch ? 3.5 : (isPinned ? 2 : 1.2);
                        ctx.stroke();
                    }
                    ctx.restore();
                };

                currentSimulation.on("tick", draw);

                canvas.addEventListener("mousemove", (event) => {
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = width / rect.width;
                    const scaleY = height / rect.height;
                    const mouseX = (event.clientX - rect.left) * scaleX;
                    const mouseY = (event.clientY - rect.top) * scaleY;

                    setHoverPos({ x: event.offsetX, y: event.offsetY });

                    const transformedX = (mouseX - canvasZoomTransform.x) / canvasZoomTransform.k;
                    const transformedY = (mouseY - canvasZoomTransform.y) / canvasZoomTransform.k;

                    let found = null;
                    let minDist = Infinity;
                    for (const node of simNodes) {
                        const dx = node.x - transformedX;
                        const dy = node.y - transformedY;
                        const dist = dx * dx + dy * dy;
                        if (dist < 900 && dist < minDist) {
                            minDist = dist;
                            found = node;
                        }
                    }
                    setHoveredNode(found);
                });

                canvas.addEventListener("mouseleave", () => setHoveredNode(null));

                canvas.addEventListener("click", (event) => {
                    if (hoveredNode()) {
                        const node = hoveredNode();
                        if (pinMode()) {
                            const currentPinned = pinnedNodes();
                            if (!currentPinned.some(p => p.id === node.id)) {
                                setPinnedNodes([...currentPinned, node]);
                            }
                        }
                    }
                });

                canvasZoomBehavior = d3.zoom()
                    .scaleExtent([0.2, 5])
                    .on("zoom", (event) => {
                        canvasZoomTransform = event.transform;
                        draw();
                    });

                d3.select(canvas).call(canvasZoomBehavior);
            };

            const graphZoomIn = () => {
                if (canvasZoomBehavior && graphContainer) {
                    const canvasSel = d3.select(graphContainer.querySelector("canvas"));
                    canvasSel.transition().call(canvasZoomBehavior.scaleBy, 1.3);
                }
            };

            const graphZoomOut = () => {
                if (canvasZoomBehavior && graphContainer) {
                    const canvasSel = d3.select(graphContainer.querySelector("canvas"));
                    canvasSel.transition().call(canvasZoomBehavior.scaleBy, 0.7);
                }
            };

            const graphZoomReset = () => {
                if (canvasZoomBehavior && graphContainer) {
                    const canvasSel = d3.select(graphContainer.querySelector("canvas"));
                    canvasSel.transition().call(canvasZoomBehavior.transform, d3.zoomIdentity);
                }
            };

            const switchTab = (tab) => {
                setActiveTab(tab);
                if (tab === 'map') {
                    if (mapContainer && mapContainer.children.length === 0) {
                        initMap(mapContainer);
                    } else if (mapContainer) {
                        fetchAndUpdateMapColors();
                    }
                } else if (tab === 'louvain') {
                    if (!graphInitialized) {
                        fetchGraphCommunities().then(() => {
                            renderCanvasGraph(graphData());
                        });
                    } else {
                        renderCanvasGraph(graphData());
                    }
                }
            };

            return h("div", {class: "max-w-6xl w-full h-full mx-auto p-4 md:p-6 space-y-4 flex-1 flex flex-col overflow-hidden"},
                h("header", {class: "flex flex-col md:flex-row md:items-start justify-between gap-4 border-b border-slate-200 pb-3 shrink-0"},
                    h("div", {},
                        h("h1", {class: "text-xl font-semibold tracking-tight text-slate-900"}, ".Gov & .Edu Document Download & Search"),
                    ),
                    h("div", {class: "flex flex-col items-end gap-2"},
                        h("div", {class: "flex items-center gap-2"},
                            h("div", {class: "relative cursor-pointer", onMouseEnter: () => setShowModal(true), onMouseLeave: () => setShowModal(false)},
                                h("span", {class: "text-xs text-slate-600 bg-slate-200/60 px-2.5 py-1 rounded-md font-mono inline-block"}, 
                                    () => `Counties Scraped: ${progress().counties_completed || 0} / 3,144`
                                ),
                                () => showModal() && h("div", {class: "absolute right-0 top-full mt-2 w-72 bg-white border border-slate-200 rounded-xl shadow-xl p-5 text-xs space-y-2 z-50 text-slate-700"},
                                    h("p", {class: "font-semibold border-b border-slate-100 pb-1.5 text-slate-900"}, "Telemetry & TLD Stats"),
                                    // FIXED: Using progress().counties_completed with fallback to domains_crawled only if not present, but correctly labeled and bound
                                    h("div", {class: "flex justify-between"}, h("span", {}, "Counties Scraped:"), h("span", {class: "font-mono font-medium"}, () => `${progress().counties_completed || 0} / 3,144`)),
                                    h("div", {class: "flex justify-between"}, h("span", {}, ".Gov Domains Crawled:"), h("span", {class: "font-mono font-medium"}, () => progress().gov_crawled || 0)),
                                    h("div", {class: "flex justify-between"}, h("span", {}, ".Edu Domains Crawled:"), h("span", {class: "font-mono font-medium"}, () => progress().edu_crawled || 0)),
