<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Intelligence & Public Documents Crawler Suite</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <script type="importmap">
    {
        "imports": {
            "solid-js": "https://esm.sh/solid-js@1.8.14",
            "solid-js/web": "https://esm.sh/solid-js@1.8.14/web",
            "solid-js/store": "https://esm.sh/solid-js@1.8.14/store",
            "solid-js/h": "https://esm.sh/solid-js@1.8.14/h"
        }
    }
    </script>
    <style>
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        html, body {
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased h-screen flex flex-col font-sans overflow-hidden">
    <div id="app" class="h-full flex flex-col w-full overflow-hidden"></div>
    <script type="module">
        import { createSignal, createMemo, createResource, onMount, createEffect, Suspense } from "solid-js";
        import { createStore } from "solid-js/store";
        import { render } from "solid-js/web";
        import h from "solid-js/h";

        function App() {
            const [state, setState] = createStore({
                activeTab: 'map',
                q: "",
                exhaustive: false,
                isEmbActive: false,
                progress: { visited: 0, total: 0, pdfs_discovered: 0, domains_crawled: 0, total_domains: 0, gov_completed: 0, wiki_crawled: 0, arxiv_crawled: 0, gov_crawled: 0, edu_crawled: 0, mil_crawled: 0, total_gov: 0, total_edu: 0, total_mil: 0, total_wiki: 6800000, total_arxiv: 2500000 },
                isPaused: true,
                graphData: { nodes: [], edges: [], community_count: 0, modularity: 0.0, clustering_coefficient: 0.0 },
                graphLoading: false,
                nodeQuery: "",
                wikiTotal: 0,
                arxivTotal: 0,
                wikiTotalCount: 6800000,
                arxivTotalCount: 2500000,
                pendingEmbeddings: 0,
                totalEmbeddings: 0,
                pinnedNodes: [],
                pinMode: false,
                bottomPaneTab: 'results',
                isGraphFullscreen: false,
                displayLimit: 20,
                catalogQuery: "",
                catalogItems: [],
                catalogPage: 1,
                catalogPageSize: 50,
                catalogTotalCount: 0,
                loadingCatalog: false,
                selectedDocIds: {},
                runningCatalogLouvain: false,
                actionStates: {}
            });

            const [logs, setLogs] = createSignal([{ time: new Date().toLocaleTimeString(), type: "SYSTEM", message: "Pipeline logging initialized." }]);
            const [hoveredNode, setHoveredNode] = createSignal(null);
            const [hoverPos, setHoverPos] = createSignal({ x: 0, y: 0 });
            const [mapLoading, setMapLoading] = createSignal(true);
            const [searchTrigger, setSearchTrigger] = createSignal("");
            const [showProgressTooltip, setShowProgressTooltip] = createSignal(false);

            let graphAbortController = null;
            const catalogCache = {};

            const [searchResultResource, { mutate: mutateSearchResults }] = createResource(searchTrigger, async (query) => {
                if (!query) return [];
                try {
                    const resp = await fetch("/search", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ query, exhaustive: state.exhaustive })
                    });
                    const r = await resp.json();
                    setState("displayLimit", 20);
                    return (r.results || []).slice(0, 100);
                } catch (e) {
                    return [];
                }
            });

            let mapContainer, graphContainer, sampleSizeInput, targetPartitionsInput;
            let statusMaps = { gov: {}, edu: {}, mil: {} };
            let zoomTransform = d3.zoomIdentity, zoomBehavior = null, simulation = null;

            const log = (type, message) => setLogs(l => [{ time: new Date().toLocaleTimeString(), type, message }, ...l.slice(0, 99)]);

            onMount(async () => {
                try {
                    const initState = await (await fetch("/state")).json();
                    if (initState.progress) {
                        setState("progress", initState.progress);
                        if (initState.progress.wiki_crawled !== undefined) {
                            setState("wikiTotal", initState.progress.wiki_crawled);
                            setState("progress", "wiki_crawled", initState.progress.wiki_crawled);
                        }
                        if (initState.progress.arxiv_crawled !== undefined) {
                            setState("arxivTotal", initState.progress.arxiv_crawled);
                            setState("progress", "arxiv_crawled", initState.progress.arxiv_crawled);
                        }
                    }
                    const statRes = await (await fetch("/crawler/status-legacy")).json();
                    setState("isPaused", statRes.paused);
                } catch (e) {}

                fetchStats();
                fetchWikiStats();
                fetchArxivStats();
                fetchGraphCommunities();
                fetchCatalog(state.catalogPage);

                setTimeout(() => {
                    if (mapContainer) initMap(mapContainer);
                }, 50);

                setInterval(async () => {
                    fetchWikiStats();
                    fetchArxivStats();
                }, 3000);

                const connectWs = () => {
                    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss://' : 'ws://'}${location.port === '3000' ? `${location.hostname}:8000` : location.host}/ws`);
                    ws.onmessage = async e => {
                        try {
                            const d = JSON.parse(e.data);
                            if (d.type === "progress" || d.type === "stats") {
                                if (d.stats) {
                                    setState("progress", p => ({ ...p, ...d.stats }));
                                    if (d.stats.wiki_crawled !== undefined) {
                                        setState("wikiTotal", d.stats.wiki_crawled);
                                        setState("progress", "wiki_crawled", d.stats.wiki_crawled);
                                    }
                                    if (d.stats.arxiv_crawled !== undefined) {
                                        setState("arxivTotal", d.stats.arxiv_crawled);
                                        setState("progress", "arxiv_crawled", d.stats.arxiv_crawled);
                                    }
                                }
                            } else if (d.type === "queue_update") {
                                log("QUEUE", `Queue [${d.tld_type || 'gov'}]: Current target "${d.current || 'Unknown'} (${d.queue_len || 0} remaining)"`);
                            } else if (d.type === "pdf_found" || d.type === "document_discovered" || d.type === "wiki_crawl" || d.type === "wiki_article" || d.type === "arxiv_paper" || d.domain === "en.wikipedia.org" || d.domain === "arxiv.org") {
                                if (d.domain === "en.wikipedia.org" || d.title || d.type.includes("wiki")) {
                                    log("WIKI", `Crawled Wiki Article: ${d.title || d.pdf_url || d.current || 'In Progress'}`);
                                    setState("progress", "wiki_crawled", (state.progress.wiki_crawled || 0) + 1);
                                    setState("wikiTotal", (state.wikiTotal || 0) + 1);
                                } else if (d.domain === "arxiv.org" || d.type.includes("arxiv")) {
                                    log("ARXIV", `Crawled arXiv Paper: ${d.title || d.pdf_url || 'In Progress'}`);
                                    setState("progress", "arxiv_crawled", (state.progress.arxiv_crawled || 0) + 1);
                                    setState("arxivTotal", (state.arxivTotal || 0) + 1);
                                } else {
                                    log("DISCOVERY", `Discovered document: ${d.pdf_url || 'Unknown URL'}`);
                                }
                                fetchStats();
                                fetchWikiStats();
                                fetchArxivStats();
                                delete catalogCache[state.catalogPage];
                                fetchCatalog(state.catalogPage);
                            } else if (d.type === "domain_update" || d.type === "crawl_complete") {
                                log("CRAWL", `Domain [${d.domain || 'Target'}]: Status -> ${d.status || 'SUCCESS'}`);
                                fetchWikiStats();
                                fetchArxivStats();
                                delete catalogCache[state.catalogPage];
                                fetchCatalog(state.catalogPage);
                                if (mapContainer && state.activeTab === 'map') updateMapColors();
                            } else if (d.type === "embedding_complete" || d.type === "vector_indexed") {
                                log("EMBEDDING", "Vector embedding generated & stored.");
                                fetchStats();
                                fetchWikiStats();
                                fetchArxivStats();
                                delete catalogCache[state.catalogPage];
                                fetchCatalog(state.catalogPage);
                            } else if (d.message) {
                                log(d.type || "INFO", d.message);
                            }
                        } catch (err) {}
                    };
                    ws.onclose = () => setTimeout(connectWs, 3000);
                };
                connectWs();
            });

            const fetchWikiStats = async () => {
                try {
                    const r = await (await fetch("/wiki/status")).json();
                    setState("wikiTotal", r.total_downloaded || 0);
                    setState("progress", "wiki_crawled", r.total_downloaded || 0);
                } catch (e) {}
            };

            const fetchArxivStats = async () => {
                try {
                    const r = await (await fetch("/arxiv/status")).json();
                    setState("arxivTotal", r.total_downloaded || 0);
                    setState("progress", "arxiv_crawled", r.total_downloaded || 0);
                } catch (e) {}
            };

            const fetchCatalog = async (page = 1) => {
                if (catalogCache[page]) {
                    setState("catalogItems", catalogCache[page].items);
                    setState("catalogTotalCount", catalogCache[page].total);
                    setState("catalogPage", page);
                    return;
                }
                setState("loadingCatalog", true);
                try {
                    const r = await (await fetch(`/api/catalog?page=${page}&limit=${state.catalogPageSize}`)).json();
                    const items = r.items || [];
                    const total = r.total || 0;
                    catalogCache[page] = { items, total };
                    setState("catalogItems", items);
                    setState("catalogTotalCount", total);
                    setState("catalogPage", page);

                    if ((page * state.catalogPageSize) < total && !catalogCache[page + 1]) {
                        fetch(`/api/catalog?page=${page + 1}&limit=${state.catalogPageSize}`)
                            .then(res => res.json())
                            .then(nextRes => {
                                catalogCache[page + 1] = { items: nextRes.items || [], total: nextRes.total || total };
                            }).catch(() => {});
                    }
                } catch (e) {
                    setState("catalogItems", []);
                } finally {
                    setState("loadingCatalog", false);
                }
            };

            const filteredCatalogItems = createMemo(() => {
                const q = state.catalogQuery.toLowerCase().trim();
                const items = state.catalogItems || [];
                if (!q) return items;
                return items.filter(item => 
                    (item.domain && item.domain.toLowerCase().includes(q)) || 
                    (item.url && item.url.toLowerCase().includes(q)) ||
                    (item.state && item.state.toLowerCase().includes(q)) ||
                    (item.county && item.county.toLowerCase().includes(q))
                );
            });

            const triggerScrapeAndEmbed = async (domain) => {
                if (!domain) return;
                setState("actionStates", domain, "scraping");
                try {
                    const res = await fetch("/api/catalog/scrape", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ domain })
                    });
                    const r = await res.json();
                    log("SCRAPE", r.message || `Started scrape & embed for ${domain}`);
                    setTimeout(() => {
                        delete catalogCache[state.catalogPage];
                        fetchCatalog(state.catalogPage);
                    }, 1500);
                } catch (e) {
                    alert("Failed to trigger scrape for " + domain);
                } finally {
                    setState("actionStates", domain, null);
                }
            };

            const runFlaggedCatalogLouvain = async () => {
                const docIds = Object.keys(state.selectedDocIds).filter(k => state.selectedDocIds[k]).map(Number);
                if (docIds.length === 0) {
                    alert("Please flag/select at least one document from the catalog first.");
                    return;
                }
                setState("runningCatalogLouvain", true);
                try {
                    const res = await fetch("/graph-communities", { method: "GET" });
                    const gRes = await res.json();
                    setState("graphData", gRes);
                    setState("activeTab", 'search');
                    requestAnimationFrame(() => renderCanvasGraph(gRes));
                } catch (e) {
                    alert("Failed to run Louvain analysis on flagged documents: " + e.message);
                } finally {
                    setState("runningCatalogLouvain", false);
                }
            };

            const downloadFlaggedZip = async () => {
                const docIds = Object.keys(state.selectedDocIds).filter(k => state.selectedDocIds[k]).map(Number);
                if (docIds.length === 0) {
                    alert("Please select at least one document first.");
                    return;
                }
                alert(`Preparing bundle for ${docIds.length} document(s).`);
            };

            createEffect(() => {
                const tab = state.activeTab;
                if (tab === 'map') {
                    setTimeout(() => {
                        if (mapContainer && (!mapContainer.children.length || !mapContainer.querySelector("svg"))) {
                            initMap(mapContainer);
                        }
                    }, 50);
                } else if (tab === 'search') {
                    requestAnimationFrame(() => {
                        setTimeout(() => {
                            if (graphContainer) renderCanvasGraph(state.graphData);
                        }, 60);
                    });
                } else if (tab === 'catalog') {
                    fetchCatalog(state.catalogPage);
                }
            });

            const fetchStats = async () => {
                try {
                    const r = await (await fetch("/index-stats")).json();
                    setState("pendingEmbeddings", (r.total_documents || 0) - (r.processed_documents || 0));
                    setState("totalEmbeddings", r.total_embeddings || 0);
                } catch (e) {}
            };

            const cancelSearch = () => {
                if (graphAbortController) {
                    graphAbortController.abort();
                    graphAbortController = null;
                }
                setState("graphLoading", false);
                mutateSearchResults([]);
                log("SEARCH", "Louvain graph & search query cancelled.");
            };

            const initMap = async (container) => {
                if (!container) return;
                setMapLoading(true);
                container.innerHTML = "";
                const cached = localStorage.getItem("us_topo_json_cache");
                const usData = cached ? JSON.parse(cached) : await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/counties-albers-10m.json");
                if (!cached) localStorage.setItem("us_topo_json_cache", JSON.stringify(usData));

                const svg = d3.select(container).append("svg").attr("viewBox", "0 0 960 720").attr("class", "w-full h-full object-contain");
                const path = d3.geoPath();
                const counties = topojson.feature(usData, usData.objects.counties).features;
                const states = topojson.feature(usData, usData.objects.states).features;

                let tooltip = d3.select(container).select(".map-tooltip");
                if (tooltip.empty()) tooltip = d3.select(container).append("div").attr("class", "map-tooltip absolute hidden bg-slate-900 text-white text-xs rounded p-2 pointer-events-none shadow-lg z-50 font-mono");

                svg.append("g").selectAll("path").data(counties).join("path")
                    .attr("d", path).attr("stroke", "#cbd5e1").attr("stroke-width", 0.2).attr("class", "county-path")
                    .attr("data-county", d => d.properties.name || "")
                    .attr("fill", "#e2e8f0")
                    .on("mousemove", (event, d) => {
                        const name = d.properties.name || "Unknown";
                        tooltip.classed("hidden", false).html(`<strong>County: ${name}</strong><br/>Loading county statistics...`);
                        const [x, y] = d3.pointer(event, container);
                        tooltip.style("left", (x + 15) + "px").style("top", (y - 15) + "px");
                    })
                    .on("mouseleave", () => tooltip.classed("hidden", true));

                svg.append("g").selectAll("path").data(states).join("path")
                    .attr("d", path).attr("fill", "transparent").attr("stroke", "#475569").attr("stroke-width", 0.6)
                    .on("mousemove", (event, d) => {
                        const name = d.properties.name;
                        tooltip.classed("hidden", false).html(`<strong>${name}</strong><br/>Loading state statistics...`);
                        const [x, y] = d3.pointer(event, container);
                        tooltip.style("left", (x + 15) + "px").style("top", (y - 15) + "px");
                    })
                    .on("mouseleave", () => tooltip.classed("hidden", true));

                setMapLoading(false);

                try {
                    const countyNames = counties.map(d => d.properties.name).filter(Boolean);
                    const [mapResp, statsResp] = await Promise.all([
                        fetch("/map-status", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ counties: countyNames }) }),
                        fetch("/state-stats")
                    ]);
                    const mapRes = await mapResp.json();
                    statusMaps = { gov: mapRes.gov || {}, edu: mapRes.edu || {}, mil: mapRes.mil || {} };
                    const stateStats = await statsResp.json();

                    svg.selectAll(".county-path")
                        .attr("fill", d => statusMaps.gov[d.properties.name] === 'COMPLETED' ? "#10b981" : (['CRAWLING', 'QUEUED'].includes(statusMaps.gov[d.properties.name]) ? "#f59e0b" : "#e2e8f0"))
                        .on("mousemove", (event, d) => {
                            const name = d.properties.name || "Unknown";
                            const govStatus = statusMaps.gov[name];
                            if (!govStatus) {
                                tooltip.classed("hidden", false).html(`<strong>County: ${name}</strong><br/>Loading county statistics...`);
                            } else {
                                tooltip.classed("hidden", false).html(`<strong>County: ${name}</strong><br/>.gov: ${statusMaps.gov[name] || 'CATALOGED'}<br/>.edu: ${statusMaps.edu[name] || 'CATALOGED'}<br/>.mil: ${statusMaps.mil[name] || 'CATALOGED'}`);
                            }
                            const [x, y] = d3.pointer(event, container);
                            tooltip.style("left", (x + 15) + "px").style("top", (y - 15) + "px");
                        });

                    svg.selectAll("g path:not(.county-path)")
                        .on("mousemove", (event, d) => {
                            const name = d.properties.name, stats = stateStats[name] || stateStats[name?.toUpperCase()] || stateStats[name?.toLowerCase()] || { gov_urls: 0, edu_urls: 0, mil_urls: 0, documents: 0, embeddings: 0 };
                            tooltip.classed("hidden", false).html(`<strong>${name}</strong><br/>.gov: ${stats.gov_urls || stats.gov || 0} | .edu: ${stats.edu_urls || stats.edu || 0} | .mil: ${stats.mil_urls || stats.mil || 0}<br/>Docs: ${stats.documents || 0} | Embeddings: ${stats.embeddings || 0}`);
                            const [x, y] = d3.pointer(event, container);
                            tooltip.style("left", (x + 15) + "px").style("top", (y - 15) + "px");
                        });
                } catch (e) {}
            };

            const updateMapColors = async () => {
                if (!mapContainer) return;
                const paths = mapContainer.querySelectorAll(".county-path");
                if (!paths.length) return;
                try {
                    const resp = await fetch("/map-status", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ counties: Array.from(paths).map(p => p.getAttribute("data-county")).filter(Boolean) }) });
                    const mapRes = await resp.json();
                    statusMaps = { gov: mapRes.gov || {}, edu: mapRes.edu || {}, mil: mapRes.mil || {} };
                    paths.forEach(p => {
                        const status = statusMaps.gov[p.getAttribute("data-county")] || "CATALOGED";
                        p.setAttribute("fill", status === 'COMPLETED' ? "#10b981" : (['CRAWLING', 'QUEUED'].includes(status) ? "#f59e0b" : "#e2e8f0"));
                    });
                } catch (e) {}
            };

            const handleSearchSubmit = async (e) => {
                e.preventDefault();
                const queryVal = state.q.trim();
                if (!queryVal) return;
                setState("nodeQuery", queryVal);
                setSearchTrigger(queryVal);
                
                try {
                    const resp = await fetch("/search", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ query: queryVal, exhaustive: state.exhaustive })
                    });
                    const r = await resp.json();
                    setState("displayLimit", 20);
                    mutateSearchResults([...(r.results || []).slice(0, 100)]);
                } catch (err) {}

                fetchGraphCommunities();
            };

            const fetchGraphCommunities = async () => {
                if (graphAbortController) graphAbortController.abort();
                graphAbortController = new AbortController();
                setState("graphLoading", true);
                try {
                    const queryParam = encodeURIComponent(state.q);
                    const sampleSizeVal = sampleSizeInput?.value || 150;
                    const res = await fetch(`/graph-communities?target_partitions=${targetPartitionsInput?.value || 5}&sample_size=${state.exhaustive ? 400 : sampleSizeVal}&query=${queryParam}`, { signal: graphAbortController.signal });
                    const gRes = await res.json();
                    setState("graphData", gRes);
                    if (state.activeTab === 'search') {
                        requestAnimationFrame(() => renderCanvasGraph(gRes));
                    }
                    fetchStats();
                } catch (e) {
                    if (e.name !== 'AbortError') log("SEARCH", "Error fetching Louvain graph partitions.");
                } finally {
                    setState("graphLoading", false);
                }
            };

            const renderCanvasGraph = (data) => {
                if (!graphContainer) return;
                graphContainer.innerHTML = "";
                const nodes = data.nodes || [];
                if (!nodes.length) {
                    graphContainer.innerHTML = "<div class='text-xs text-slate-400 py-12'>No indexed chunks available for graph visualization.</div>";
                    return;
                }

                const width = graphContainer.clientWidth || 1000;
                const height = state.isGraphFullscreen ? 700 : 450;
                const canvas = document.createElement("canvas");
                canvas.width = width * window.devicePixelRatio;
                canvas.height = height * window.devicePixelRatio;
                canvas.style.cssText = state.isGraphFullscreen ? "width:100%;height:100%;object-fit:contain;" : "width:100%;height:100%;object-fit:contain;";
                graphContainer.appendChild(canvas);

                const ctx = canvas.getContext("2d");
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                const colorScale = d3.scaleOrdinal(d3.schemeTableau10);
                
                const simNodes = nodes.map(d => ({...d}));
                const activeIds = new Set(simNodes.map(n => n.id));
                const simLinks = (data.edges || []).filter(l => activeIds.has(l.source.id || l.source) && activeIds.has(l.target.id || l.target)).map(d => ({...d}));

                if (simulation) simulation.stop();
                simulation = d3.forceSimulation(simNodes)
                    .force("link", d3.forceLink(simLinks).id(d => d.id).distance(45))
                    .force("charge", d3.forceManyBody().strength(-25))
                    .force("center", d3.forceCenter(width / 2, height / 2));

                const draw = () => {
                    ctx.save();
                    ctx.clearRect(0, 0, width, height);
                    ctx.translate(zoomTransform.x, zoomTransform.y);
                    ctx.scale(zoomTransform.k, zoomTransform.k);

                    ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 0.8;
                    for (const l of simLinks) {
                        ctx.beginPath(); ctx.moveTo(l.source.x, l.source.y); ctx.lineTo(l.target.x, l.target.y); ctx.stroke();
                    }

                    const query = state.nodeQuery.toLowerCase().trim();
                    const topResult = searchResultResource()?.[0];

                    for (const n of simNodes) {
                        ctx.beginPath();
                        const isMatch = query && (n.full_text.toLowerCase().includes(query) || String(n.id).includes(query));
                        const isTopMatch = topResult && (n.full_text.includes(topResult.chunk.slice(0, 30)) || n.pdf_url === topResult.pdf_url);
                        const isPinned = state.pinnedNodes.some(p => p.id === n.id);

                        ctx.arc(n.x, n.y, isTopMatch ? 14 : (isPinned ? 10 : (isMatch ? 12 : 7)), 0, 2 * Math.PI);
                        
                        let baseColor = d3.color(colorScale(n.group));
                        let rel = n.relevance !== undefined ? n.relevance : 0.5;
                        if (baseColor) {
                            baseColor.opacity = 0.3 + (rel * 0.7);
                            ctx.fillStyle = baseColor.toString();
                        } else {
                            ctx.fillStyle = colorScale(n.group);
                        }
                        ctx.fill();

                        ctx.strokeStyle = isTopMatch ? "#eab308" : (isMatch ? "#d946ef" : (isPinned ? "#0f172a" : (rel > 0.7 ? "#0f172a" : "#ffffff")));
                        ctx.lineWidth = isTopMatch ? 5 : (isMatch ? 4 : (isPinned ? 3 : (rel > 0.7 ? 2 : 1.2)));
                        ctx.stroke();

                        if (isTopMatch) {
                            ctx.fillStyle = "#eab308";
                            ctx.font = "bold 12px monospace";
                            ctx.fillText("★ TOP MATCH", n.x + 16, n.y + 4);
                        }
                    }
                    ctx.restore();
                };

                simulation.on("tick", draw);

                canvas.addEventListener("mousemove", (e) => {
                    const rect = canvas.getBoundingClientRect();
                    setHoverPos({ x: e.offsetX, y: e.offsetY });
                    const tx = ((e.clientX - rect.left) * (width / rect.width) - zoomTransform.x) / zoomTransform.k;
                    const ty = ((e.clientY - rect.top) * (height / rect.height) - zoomTransform.y) / zoomTransform.k;
                    let found = null, minDist = Infinity;
                    for (const n of simNodes) {
                        const dist = (n.x - tx) ** 2 + (n.y - ty) ** 2;
                        if (dist < 900 && dist < minDist) { minDist = dist; found = n; }
                    }
                    setHoveredNode(found);
                });

                                                ]),
                                                h("td", {class: "py-2 px-2.5"}, [
                                                    h("span", {class: () => `px-1.5 py-0.5 rounded text-[10px] font-bold ${item.chunks_count > 0 ? 'bg-emerald-100 text-emerald-800' : (item.status === 'CRAWLING' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-600')}`}, () => item.chunks_count > 0 ? (item.status || 'COMPLETED') : 'CATALOGED')
                                                ]),
                                                h("td", {class: "py-2 px-2.5 text-right font-semibold text-slate-900"}, item.chunks_count || 0),
                                                h("td", {class: "py-2 px-2.5 text-center"}, [
                                                    item.chunks_count > 0 ? 
                                                    h("span", {class: "text-emerald-600 font-semibold text-[10px]"}, "Embedded") :
                                                    h("button", {
                                                        onClick: () => triggerScrapeAndEmbed(item.domain),
                                                        disabled: () => state.actionStates[item.domain] === 'scraping',
                                                        class: "px-2 py-0.5 bg-slate-900 hover:bg-slate-800 text-white rounded font-medium text-[10px] transition disabled:opacity-50 cursor-pointer"
                                                    }, () => state.actionStates[item.domain] === 'scraping' ? "Processing..." : "Scrape & Embed Now")
                                                ])
                                            ]))
                                        ])
                                    ])
                                ]),
                                h("div", {class: "flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-slate-100 shrink-0"}, [
                                    h("div", {class: "flex items-center gap-2 font-mono text-xs text-slate-600"}, [
                                        h("button", {
                                            onClick: () => fetchCatalog(Math.max(1, state.catalogPage - 1)),
                                            disabled: () => state.catalogPage <= 1 || state.loadingCatalog,
                                            class: "px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded disabled:opacity-40 cursor-pointer"
                                        }, "Prev"),
                                        h("span", {}, () => `Page ${state.catalogPage} of ${Math.ceil(state.catalogTotalCount / state.catalogPageSize) || 1}`),
                                        h("button", {
                                            onClick: () => fetchCatalog(state.catalogPage + 1),
                                            disabled: () => (state.catalogPage * state.catalogPageSize) >= state.catalogTotalCount || state.loadingCatalog,
                                            class: "px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded disabled:opacity-40 cursor-pointer"
                                        }, "Next"),
                                        h("span", {class: "text-slate-400 text-[11px] ml-2"}, () => `Total: ${state.catalogTotalCount} records`)
                                    ]),
                                    h("div", {class: "flex items-center gap-2"}, [
                                        h("button", {
                                            onClick: downloadFlaggedZip,
                                            class: "px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded transition shadow-xs cursor-pointer whitespace-nowrap"
                                        }, "Export Bundle"),
                                        h("button", {
                                            onClick: runFlaggedCatalogLouvain,
                                            disabled: () => state.runningCatalogLouvain,
                                            class: "px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs rounded transition shadow-xs disabled:opacity-50 cursor-pointer whitespace-nowrap"
                                        }, () => state.runningCatalogLouvain ? "Analyzing..." : "Add Selected Document Chunks to Louvain Diagram")
                                    ])
                                ])
                            ])
                        ])
                    )
                )
            );
        }
        render(App, document.getElementById("app"));
    </script>
</body>
</html>
