services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gov_intel
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gov_intel"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim

        WORKDIR /app

        RUN apt-get update && apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            git \
            libpq-dev \
            && rm -rf /var/lib/apt/lists/*

        RUN pip install --no-cache-dir \
            "numpy<2" \
            fastapi==0.110.0 \
            uvicorn==0.28.0 \
            httpx==0.27.0 \
            beautifulsoup4==4.12.3 \
            pypdf==4.1.0 \
            sentence-transformers==2.5.1 \
            "psycopg[binary,pool]" \
            pgvector==0.2.5 \
            websockets==12.0 \
            networkx==3.2.1

        RUN mkdir -p /app/data && \
            curl -L "https://raw.githubusercontent.com/cisagov/dotgov-data/main/current-full.csv" -o /app/data/current-full.csv && \
            curl -L "https://raw.githubusercontent.com/nickdenardis/edu-inventory/master/edu-info.csv" -o /app/data/edu-domains.csv && \
            python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

        COPY . .

        EXPOSE 8000
        CMD ["python", "main.py"]
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/gov_intel
    volumes:
      - ./index.html:/app/index.html
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data: